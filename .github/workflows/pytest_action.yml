name: Testing with Pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src test --max-line-length=100

      - name: Run pytest with coverage
        run: pytest --junitxml=pytest-report.xml --cov=src --cov-report=term-missing --cov-fail-under=90

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: pytest-report.xml

      - name: Notify on success
        if: success()
        run: echo "Pytest passed on Python ${{ matrix.python-version }}"

      - name: Notify on failure
        if: failure()
        run: echo "Pytest failed on Python ${{ matrix.python-version }}"
